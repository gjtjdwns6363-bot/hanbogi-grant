name: build

on:
  schedule:
    - cron: '30 20 * * *' # 매일 05:30 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # state/pages.json(lastmod 기록)을 main에 커밋
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.build.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.js
      - id: build
        run: |
          set +e
          node build.js
          c=$?
          if [ $c -eq 3 ]; then
            echo "::warning::API 인증 실패(키 없음·미승인) — 배포를 건너뛰고 기존 사이트를 유지해요"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $c
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - if: steps.build.outputs.skip != '1'
        uses: actions/configure-pages@v5
      - if: steps.build.outputs.skip != '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.build.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: |
            state/pages.json
            indexnow.json
          retention-days: 3
  deploy:
    needs: build
    if: needs.build.outputs.skip != '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  after-deploy: # 배포가 끝난 뒤에만: lastmod 기록 커밋 + IndexNow(오늘 바뀐 URL만)
    needs: [build, deploy]
    if: needs.build.outputs.skip != '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: state
      - name: lastmod 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/pages.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "lastmod 기록 갱신 [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::warning::state/pages.json 푸시 실패 — 다음 실행에서 lastmod가 다시 오늘로 잡힐 수 있어요"
      - name: IndexNow (네이버·Bing 등)
        run: |
          n=$(jq length indexnow.json)
          echo "보낼 URL: $n개"
          if [ "$n" -eq 0 ]; then exit 0; fi
          KEY=e386846d4b6f939fd1b440af9728c599
          jq -c --arg k "$KEY" '{host:"grant.hanbogi.com",key:$k,keyLocation:("https://grant.hanbogi.com/"+$k+".txt"),urlList:.}' indexnow.json > body.json
          for ep in https://searchadvisor.naver.com/indexnow https://api.indexnow.org/indexnow; do
            code=$(curl -s -o resp.txt -w "%{http_code}" -H "Content-Type: application/json; charset=utf-8" --data-binary @body.json "$ep")
            echo "$ep → HTTP $code $(head -c 300 resp.txt)"
            case $code in 200|202) ;; *) echo "::warning::IndexNow $ep HTTP $code";; esac
          done
